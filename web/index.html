<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <header>
        <h1 class="title">Tetris</h1>
    </header>

    <main id="game-area">
        <div id="board-wrap">
            <svg id="board" role="img" aria-label="Tetris playfield"></svg>
            <div id="game-over-overlay" class="hidden">
                <p class="go-title">Game over</p>
                <p class="go-score">Score <span id="final-score">0</span></p>

                <!-- Shown only when the run makes the top 10. scores.js decides. -->
                <div id="name-entry" class="hidden">
                    <label for="player-name">New high score — your name:</label>
                    <input id="player-name" type="text" maxlength="16" autocomplete="off" placeholder="Guest">
                    <button id="save-score-button" type="button">Save</button>
                </div>

                <button id="restart-button" type="button">New game</button>
            </div>
        </div>

        <aside id="side-panel">
            <section class="panel-box" id="hold-box">
                <h2>Hold</h2>
                <svg class="preview" id="hold-preview"></svg>
            </section>

            <section class="panel-box" id="next-box">
                <h2>Next</h2>
                <svg class="preview" id="next-preview"></svg>
            </section>

            <section class="panel-box" id="stats-box">
                <dl>
                    <div class="stat-row"><dt>Score</dt><dd id="score">0</dd></div>
                    <div class="stat-row"><dt>Level</dt><dd id="level">0</dd></div>
                    <div class="stat-row"><dt>Lines</dt><dd id="lines">0</dd></div>
                </dl>
            </section>

            <button id="new-game-button" type="button">New game</button>
        </aside>
    </main>

    <section class="panel-box" id="leaderboard-box">
        <div class="leaderboard-head">
            <h2>High scores</h2>
            <button id="clear-scores-button" type="button" class="ghost-button">Clear</button>
        </div>
        <!-- renderLeaderboard() fills this. The empty-state <li> is the
             placeholder shown before any scores exist. -->
        <ol id="leaderboard">
            <li class="leaderboard-empty">No scores yet — play a game.</li>
        </ol>
    </section>

    <footer>
        <p class="controls-hint">&larr; &rarr; move &middot; &darr; soft drop &middot; space hard drop &middot; Z rotate clockwise &middot; X rotate counterclockwise &middot; C hold</p>
    </footer>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
